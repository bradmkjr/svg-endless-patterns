name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run lint
      - name: Check maze API URL
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.ENDLESS_PATTERNS_API_URL }}
        run: test -n "$NEXT_PUBLIC_API_BASE_URL" || (echo "Set the ENDLESS_PATTERNS_API_URL repository variable to the deployed maze API origin." && exit 1)
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://endless-patterns.com
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.ENDLESS_PATTERNS_API_URL }}
          API_INTERNAL_URL: ${{ vars.ENDLESS_PATTERNS_INTERNAL_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
